[project]
name = "vr-douchong"
version = "1.0.5"
description = "VR/PSP live event collection and statistics API"
readme = "readme.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.9,<4",
    "anyio>=4,<5",
    "Brotli>=1.2,<2",
    "fastapi>=0.161.0,<1",
    "starlette>=1.9.0,<2",
    "pydantic>=2.9,<3",
    "pure-protobuf~=3.1.2",
    "PyMySQL>=1.1,<2",
    "redis>=5,<9",
    "SQLAlchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "yarl>=1.9,<2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.25,<3",
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "ruff>=0.17.2,<0.18",
]

[tool.uv]
package = false
required-version = "==0.11.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The vendored library intentionally uses typing/export star imports.
# Keep its checked-in protocol implementation unchanged when configuring CI.
"app/blivedm/**/*.py" = ["F403", "F405"]
